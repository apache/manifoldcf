name: CI
run-name: ${{ github.actor }} is executing CI build and tests 🚀

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  buildAndTest:
    runs-on: ubuntu-24.04
    env:
      ANT_OPTS: -Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up OpenJDK 25 Temurin x64
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64

      - name: Ant Build and Test
        run: ant make-core-deps make-deps build test
